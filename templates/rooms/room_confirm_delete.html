{% extends "base.html" %}
{% block title %}Delete Room{% endblock %}

{% block content %}
<div class="card shadow-sm col-md-6 mx-auto">
  <div class="card-body">
    <h4>Delete Room {{ object.room_no }}?</h4>
    <p class="text-muted">All its beds will also be deleted.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'room_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
